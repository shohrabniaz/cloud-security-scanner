name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run offline demo scan
        run: |
          set +e
          python -m src.cli scan --demo --format json
          code=$?
          # Exit 1 is expected when CRITICAL/HIGH findings are present.
          if [ "$code" -gt 1 ]; then exit "$code"; fi

  sarif:
    # Uploads the offline demo scan to GitHub Code Scanning so the SARIF
    # path is exercised on every push (demo data only, no Azure access).
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m src.cli scan --demo --format sarif > demo.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: demo.sarif
          category: demo-scan
