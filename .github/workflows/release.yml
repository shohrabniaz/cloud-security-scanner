name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python -m pytest -q
      - run: python -m src.cli scan --demo --format sarif > demo-findings.sarif || true
      - run: python -m src.cli scan --demo --format json > demo-findings.json || true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            demo-findings.sarif
            demo-findings.json
